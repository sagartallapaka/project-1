[project]
name = "autorecruiter"
version = "0.1.0"
description = "AutoRecruiter AI – Multi-agent hiring automation platform"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "langchain>=0.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
